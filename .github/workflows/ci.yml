name: CI

on:
  push:
  pull_request:

jobs:
  validate-skills:
    runs-on:
      group: 'datadoe'
      labels: ['datadoe-small']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate skills metadata
        run: yarn test
