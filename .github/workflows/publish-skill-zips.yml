name: Publish skill ZIPs

on:
  push:
    branches:
      - development
    paths:
      - "skills/**"
      - ".github/workflows/publish-skill-zips.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build skill ZIPs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          {
            echo "# Skill ZIP downloads"
            echo
            echo "Stable URLs are published to the fixed release tag \`skills\`."
            echo
            echo "Download pattern:"
            echo
            echo "\`https://github.com/${GITHUB_REPOSITORY}/releases/download/skills/<skill-name>.zip\`"
            echo
            echo "Available assets:"
            echo
          } > dist/release-body.md

          for skill_dir in skills/*; do
            [[ -d "$skill_dir" ]] || continue

            skill_file="$skill_dir/SKILL.md"
            [[ -f "$skill_file" ]] || continue

            skill_name="$(sed -n 's/^name:[[:space:]]*//p' "$skill_file" | head -n 1 | xargs)"
            if [[ -z "$skill_name" ]]; then
              skill_name="$(basename "$skill_dir")"
            fi

            zip_path="dist/${skill_name}.zip"
            (cd "$skill_dir" && zip -qr "$GITHUB_WORKSPACE/$zip_path" .)

            printf -- '- `%s`: `https://github.com/%s/releases/download/skills/%s.zip`\n' \
              "$skill_name" \
              "$GITHUB_REPOSITORY" \
              "$skill_name" >> dist/release-body.md
          done

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skills
          name: Skill ZIP downloads
          body_path: dist/release-body.md
          files: dist/*.zip
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: false
          token: ${{ secrets.GITHUB_TOKEN }}
