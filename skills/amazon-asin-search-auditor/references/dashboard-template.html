<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amazon Search Auditor Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <style>
      :root {
        --bg: #071a17;
        --panel: rgba(5, 20, 17, 0.84);
        --line: rgba(255, 255, 255, 0.08);
        --text: #edf2ff;
        --muted: #7fbfa8;
        --accent: #12a070;
        --accent-2: #00b48c;
        --good: #12a070;
        --warn: #fbbf24;
        --bad: #fb7185;
        --shadow: 0 24px 64px rgba(0, 0, 0, 0.3);
        --radius: 16px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: "IBM Plex Sans", sans-serif;
        background:
          radial-gradient(
            circle at top left,
            rgba(18, 160, 112, 0.14),
            transparent 28%
          ),
          radial-gradient(
            circle at top right,
            rgba(0, 180, 140, 0.1),
            transparent 24%
          ),
          linear-gradient(180deg, #071d1a 0%, #071a17 100%);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.035) 1px,
            transparent 1px
          );
        background-size: 44px 44px;
        opacity: 0.16;
        mask-image: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.8),
          transparent 92%
        );
      }
      #root {
        position: relative;
        z-index: 1;
      }
      .shell {
        max-width: 1540px;
        margin: 0 auto;
        padding: 24px 18px 36px;
      }
      .hero {
        background: linear-gradient(
          135deg,
          rgba(5, 22, 18, 0.96),
          rgba(7, 26, 23, 0.92)
        );
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 28px;
        box-shadow: var(--shadow);
        overflow: hidden;
        position: relative;
        margin-bottom: 18px;
      }
      .hero::after {
        content: "";
        position: absolute;
        right: -50px;
        top: -45px;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(18, 160, 112, 0.22) 0%,
          transparent 70%
        );
      }
      .eyebrow {
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 11px;
        margin-bottom: 10px;
      }
      h1 {
        font-family: "Space Grotesk", sans-serif;
        margin: 0 0 12px;
        font-size: clamp(32px, 4vw, 60px);
        line-height: 0.95;
        letter-spacing: -0.05em;
      }
      .subhead {
        color: var(--muted);
        max-width: 86ch;
        line-height: 1.6;
      }
      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      .button {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
      }
      .button.active {
        background: linear-gradient(
          135deg,
          rgba(18, 160, 112, 0.22),
          rgba(0, 180, 140, 0.16)
        );
        border-color: rgba(18, 160, 112, 0.55);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 12px;
        margin: 16px 0 18px;
      }
      .stat,
      .panel,
      .insight,
      .card,
      .search-card,
      .item-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .stat {
        padding: 14px;
        min-height: 92px;
      }
      .stat .label {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .stat .value {
        font-family: "Space Grotesk", sans-serif;
        font-size: 30px;
        font-weight: 700;
        margin-top: 10px;
      }
      .stat .hint {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
        line-height: 1.4;
      }
      .layout {
        display: grid;
        grid-template-columns: 1.1fr 1.9fr;
        gap: 14px;
        align-items: start;
      }
      .panel {
        overflow: hidden;
      }
      .panel-head {
        padding: 16px 16px 12px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: start;
      }
      .panel-title {
        font-family: "Space Grotesk", sans-serif;
        font-size: 18px;
        font-weight: 700;
      }
      .panel-sub {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
      }
      .panel-body {
        padding: 14px 16px 16px;
      }
      .scroll {
        max-height: 71vh;
        overflow: auto;
        padding-right: 4px;
        display: grid;
        gap: 10px;
      }
      .item-card,
      .search-card {
        padding: 12px 14px;
        cursor: pointer;
        transition:
          transform 0.16s ease,
          border-color 0.16s ease,
          background 0.16s ease;
      }
      .item-card:hover,
      .search-card:hover {
        transform: translateY(-1px);
        border-color: rgba(18, 160, 112, 0.45);
      }
      .item-card.active,
      .search-card.active {
        border-color: rgba(18, 160, 112, 0.72);
        background: rgba(18, 160, 112, 0.08);
      }
      .item-top {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .thumb {
        width: 70px;
        height: 70px;
        border-radius: 16px;
        object-fit: cover;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        flex: none;
      }
      .title {
        font-weight: 700;
        line-height: 1.3;
        font-size: 14px;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        margin-top: 6px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        border: 1px solid var(--line);
      }
      .good {
        background: rgba(18, 160, 112, 0.14);
        color: #a7f3d0;
        border-color: rgba(18, 160, 112, 0.24);
      }
      .warn {
        background: rgba(251, 191, 36, 0.14);
        color: #fde68a;
        border-color: rgba(251, 191, 36, 0.24);
      }
      .bad {
        background: rgba(251, 113, 133, 0.12);
        color: #fecdd3;
        border-color: rgba(251, 113, 133, 0.24);
      }
      .detail {
        display: grid;
        gap: 14px;
      }
      .detail-hero {
        display: grid;
        grid-template-columns: 118px 1fr;
        gap: 14px;
        padding: 16px;
        border-radius: 22px;
        background: linear-gradient(
          135deg,
          rgba(18, 160, 112, 0.08),
          rgba(0, 180, 140, 0.05)
        );
        border: 1px solid rgba(18, 160, 112, 0.15);
      }
      .detail-hero .thumb {
        width: 118px;
        height: 118px;
        border-radius: 22px;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }
      .metric {
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.03);
      }
      .metric .k {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .metric .v {
        font-family: "Space Grotesk", sans-serif;
        font-size: 24px;
        font-weight: 700;
        margin-top: 8px;
      }
      .metric .s {
        color: var(--muted);
        font-size: 12px;
        margin-top: 6px;
        line-height: 1.4;
      }
      .insight-list {
        display: grid;
        gap: 10px;
      }
      .insight {
        padding: 12px 14px;
        color: var(--muted);
        line-height: 1.5;
      }
      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 18px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 760px;
        background: rgba(6, 10, 18, 0.36);
      }
      th,
      td {
        padding: 11px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        background: rgba(255, 255, 255, 0.03);
        position: sticky;
        top: 0;
        z-index: 1;
      }
      tr:hover td {
        background: rgba(255, 255, 255, 0.03);
      }
      .mono {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .search-card .headline {
        font-family: "Space Grotesk", sans-serif;
        font-size: 16px;
        font-weight: 700;
      }
      .search-card .sub {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .search-card-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .search-card-toggle {
        flex: none;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        width: 30px;
        height: 30px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        padding: 0;
      }
      .search-expanded {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 8px;
      }
      .search-expanded-title {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .mini-table {
        display: grid;
        gap: 6px;
      }
      .mini-row,
      .mini-head {
        display: grid;
        grid-template-columns: 64px 120px minmax(0, 1.6fr) 72px 58px 54px 84px;
        gap: 8px;
        align-items: center;
      }
      .mini-head {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        padding-bottom: 6px;
      }
      .mini-row {
        padding: 9px 10px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 12px;
      }
      .mini-row.owned {
        border-color: rgba(18, 160, 112, 0.3);
        background: rgba(18, 160, 112, 0.08);
      }
      .mini-row .mono {
        font-size: 11px;
      }
      .mini-action {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        padding: 6px 10px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 700;
        font-size: 12px;
        line-height: 1;
        white-space: nowrap;
      }
      .mini-action:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .search-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex: none;
      }
      @media (max-width: 1200px) {
        .stats,
        .core-band,
        .detail-grid,
        .mini-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .layout {
          grid-template-columns: 1fr;
        }
        .scroll {
          max-height: 42vh;
        }
      }
      @media (max-width: 760px) {
        .shell {
          padding: 14px 12px 30px;
        }
        .hero {
          padding: 20px;
          border-radius: 24px;
        }
        .stats,
        .core-band,
        .detail-grid,
        .mini-grid {
          grid-template-columns: 1fr;
        }
        .detail-hero {
          grid-template-columns: 1fr;
        }
        .detail-hero .thumb {
          width: 100%;
          height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__AUDIT_DATA__ = __DATA__;
    </script>
    <script>
      const h = React.createElement;
      const nf0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
      const nf2 = new Intl.NumberFormat("de-DE", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });

      function fmt(value) {
        return typeof value === "number" ? nf0.format(value) : String(value);
      }

      function fmtCurrency(value, currency) {
        if (value == null) return "n/a";
        return (nf2.format(value) + " " + (currency || "")).trim();
      }

      function Stat({ label, value, hint }) {
        return h(
          "div",
          { className: "stat" },
          h("div", { className: "label" }, label),
          h("div", { className: "value" }, fmt(value)),
          h("div", { className: "hint" }, hint),
        );
      }

      function screenshotPath(search) {
        return (
          search?.screenshotLocation ||
          search?.["screenshotLocation:"] ||
          search?.screenshot ||
          null
        );
      }

      function App() {
        const data = window.__AUDIT_DATA__;
        const sellerLabel =
          data.meta?.sellerName || data.summary?.sellerName || "Amazon";
        const marketplaceLabel =
          data.meta?.marketplace || data.summary?.marketplace || "search";
        const runFolder = data.meta?.runFolder || "current run";
        const [mode, setMode] = React.useState("asin");
        const [selectedAsin, setSelectedAsin] = React.useState(
          data.ownedAsins[0]?.asin || null,
        );
        const [selectedTerm, setSelectedTerm] = React.useState(
          data.coreSearchSummaries[0]?.searchTerm || null,
        );
        const [expandedTerms, setExpandedTerms] = React.useState(
          () =>
            new Set([data.coreSearchSummaries[0]?.searchTerm].filter(Boolean)),
        );
        const selectedAsinData =
          data.ownedAsins.find((x) => x.asin === selectedAsin) ||
          data.ownedAsins[0];
        const selectedSearchData =
          data.searches.find((x) => x.searchTerm === selectedTerm) ||
          data.searches[0];
        const selectedCore =
          data.coreSearchSummaries.find((x) => x.searchTerm === selectedTerm) ||
          selectedSearchData?.summary ||
          null;

        const topInsight = data.coreSearchSummaries
          .slice()
          .sort((a, b) => b.purchaseCount - a.purchaseCount)[0];

        return h(
          "div",
          { className: "shell" },
          h(
            "section",
            { className: "hero" },
            h(
              "div",
              { className: "eyebrow" },
              sellerLabel + " • Amazon " + marketplaceLabel + " search audit",
            ),
            h("h1", null, "Visibility report for organic and sponsored search"),
            h(
              "div",
              { className: "controls" },
              h(
                "button",
                {
                  className: "button " + (mode === "asin" ? "active" : ""),
                  onClick: () => setMode("asin"),
                },
                "ASIN mode",
              ),
              h(
                "button",
                {
                  className: "button " + (mode === "search" ? "active" : ""),
                  onClick: () => setMode("search"),
                },
                "Search mode",
              ),
            ),
          ),

          h(
            "div",
            { className: "stats" },
            h(Stat, {
              label: "Tracked terms",
              value: data.summary.searchTermCount,
              hint: "Unique search terms from the core dataset",
            }),
            h(Stat, {
              label: "Owned ASINs found",
              value: data.summary.ownedAsinCount,
              hint:
                "Distinct " + sellerLabel + " ASINs visible in search results",
            }),
            h(Stat, {
              label: "Results scanned",
              value: data.summary.totalCards,
              hint:
                data.summary.organicCards +
                " organic cards and " +
                data.summary.sponsoredCards +
                " sponsored cards",
            }),
            h(Stat, {
              label: "Terms with hits",
              value: data.summary.termsWithOwnedHits,
              hint: "How many search pages contained at least one owned ASIN",
            }),
            h(Stat, {
              label: "Best organic rank",
              value: data.summary.bestOrganicRank || "n/a",
              hint: "Lowest rank achieved by an owned ASIN",
            }),
            h(Stat, {
              label: "Best PPC rank",
              value: data.summary.bestPpcRank || "n/a",
              hint: "Best sponsored rank found among owned ASINs",
            }),
          ),

          h(
            "div",
            {
              className: "layout",
              style: mode === "search" ? { gridTemplateColumns: "1fr" } : null,
            },
            h(
              "section",
              { className: "panel" },
              h(
                "div",
                { className: "panel-head" },
                h(
                  "div",
                  null,
                  h(
                    "div",
                    { className: "panel-title" },
                    mode === "asin" ? "Owned ASINs" : "Search terms",
                  ),
                  h(
                    "div",
                    { className: "panel-sub" },
                    mode === "asin"
                      ? "Tiles for " +
                          sellerLabel +
                          " ASINs that appear in the tracked pages"
                      : "Terms sorted by demand from DataDoe",
                  ),
                ),
                h(
                  "div",
                  { className: "panel-sub mono" },
                  mode === "asin"
                    ? data.ownedAsins.length + " tiles"
                    : data.coreSearchSummaries.length + " terms",
                ),
              ),
              h(
                "div",
                { className: "panel-body" },
                mode === "asin"
                  ? h(
                      "div",
                      { className: "scroll" },
                      data.ownedAsins.map((asin) =>
                        h(
                          "div",
                          {
                            className:
                              "item-card " +
                              (selectedAsin === asin.asin ? "active" : ""),
                            key: asin.asin,
                            onClick: () => setSelectedAsin(asin.asin),
                          },
                          h(
                            "div",
                            { className: "item-top" },
                            h("img", {
                              className: "thumb",
                              src:
                                asin.asin_image_url ||
                                "https://via.placeholder.com/124?text=ASIN",
                              alt: asin.title || asin.asin,
                            }),
                            h(
                              "div",
                              null,
                              h(
                                "div",
                                { className: "title" },
                                asin.title || asin.asin,
                              ),
                              h("div", { className: "meta" }, [
                                h(
                                  "span",
                                  { className: "pill good", key: "rank" },
                                  asin.bestOrganicRank != null
                                    ? "organic #" + asin.bestOrganicRank
                                    : "no organic rank",
                                ),
                                h(
                                  "span",
                                  { className: "pill warn", key: "ppc" },
                                  asin.bestPpcRank != null
                                    ? "ppc #" + asin.bestPpcRank
                                    : "no ppc rank",
                                ),
                                h(
                                  "span",
                                  { className: "pill", key: "app" },
                                  asin.appearances.length + " appearances",
                                ),
                                h(
                                  "span",
                                  { className: "mono", key: "asin" },
                                  asin.asin,
                                ),
                              ]),
                            ),
                          ),
                        ),
                      ),
                    )
                  : h(
                      "div",
                      { className: "scroll" },
                      [...data.coreSearchSummaries]
                        .sort((a, b) => b.purchaseCount - a.purchaseCount)
                        .map((summary) =>
                          (() => {
                            const search = data.searches.find(
                              (x) => x.searchTerm === summary.searchTerm,
                            );
                            const screenshot = screenshotPath(search);
                            const isExpanded = expandedTerms.has(
                              summary.searchTerm,
                            );
                            const items = search
                              ? [
                                  ...search.ppcRanks.map((x) => ({
                                    ...x,
                                    kind: "ppc",
                                  })),
                                  ...search.organicRanks.map((x) => ({
                                    ...x,
                                    kind: "organic",
                                  })),
                                ].sort((a, b) => {
                                  const ra =
                                    a.kind === "ppc"
                                      ? a.ppcRank
                                      : a.organicRank;
                                  const rb =
                                    b.kind === "ppc"
                                      ? b.ppcRank
                                      : b.organicRank;
                                  return ra - rb;
                                })
                              : [];
                            return h(
                              "div",
                              {
                                className:
                                  "search-card " +
                                  (selectedTerm === summary.searchTerm
                                    ? "active"
                                    : ""),
                                key: summary.searchTerm,
                                onClick: () =>
                                  setSelectedTerm(summary.searchTerm),
                              },
                              h(
                                "div",
                                { className: "search-card-head" },
                                h(
                                  "div",
                                  null,
                                  h(
                                    "div",
                                    { className: "headline" },
                                    summary.searchTerm,
                                  ),
                                  h("div", { className: "sub" }, [
                                    h(
                                      "span",
                                      { className: "pill good", key: "p" },
                                      summary.purchaseCount + " purchases",
                                    ),
                                    h(
                                      "span",
                                      { className: "pill", key: "r" },
                                      "SQP rel. rank #" +
                                        (summary.sqpRelativeRank ??
                                          summary.organicRank),
                                    ),
                                    h(
                                      "span",
                                      { className: "pill", key: "v" },
                                      summary.searchVolume + " search volume",
                                    ),
                                    h(
                                      "span",
                                      { className: "pill", key: "i" },
                                      summary.impressions + " impressions",
                                    ),
                                  ]),
                                ),
                                h("div", { className: "search-actions" }, [
                                  screenshot
                                    ? h(
                                        "a",
                                        {
                                          className: "mini-action",
                                          key: "shot",
                                          href: screenshot,
                                          target: "_blank",
                                          rel: "noreferrer",
                                          onClick: (e) => e.stopPropagation(),
                                        },
                                        "screenshot",
                                      )
                                    : h(
                                        "button",
                                        {
                                          className: "mini-action",
                                          key: "shot",
                                          disabled: true,
                                        },
                                        "screenshot",
                                      ),
                                  h(
                                    "button",
                                    {
                                      className: "search-card-toggle",
                                      key: "toggle",
                                      title: isExpanded
                                        ? "Collapse results"
                                        : "Expand results",
                                      onClick: (e) => {
                                        e.stopPropagation();
                                        setExpandedTerms((prev) => {
                                          const next = new Set(prev);
                                          if (next.has(summary.searchTerm))
                                            next.delete(summary.searchTerm);
                                          else next.add(summary.searchTerm);
                                          return next;
                                        });
                                      },
                                    },
                                    isExpanded ? "−" : "+",
                                  ),
                                ]),
                              ),
                              isExpanded &&
                                h(
                                  "div",
                                  { className: "search-expanded" },
                                  h(
                                    "div",
                                    { className: "search-expanded-title" },
                                    "All search results with owned ASINs marked",
                                  ),
                                  h(
                                    "div",
                                    { className: "mini-table" },
                                    h("div", { className: "mini-head" }, [
                                      h("div", null, "Rank"),
                                      h("div", null, "ASIN"),
                                      h("div", null, "Title"),
                                      h("div", null, "Type"),
                                      h("div", null, "Own"),
                                      h("div", null, "Price"),
                                      h("div", null, "ASIN mode"),
                                    ]),
                                    items.map((item, idx) =>
                                      h(
                                        "div",
                                        {
                                          className:
                                            "mini-row " +
                                            (item.isMyListing ? "owned" : ""),
                                          key: idx,
                                        },
                                        [
                                          h(
                                            "div",
                                            { className: "mono" },
                                            "#" +
                                              (item.kind === "ppc"
                                                ? item.ppcRank
                                                : item.organicRank),
                                          ),
                                          h(
                                            "div",
                                            { className: "mono" },
                                            item.asin,
                                          ),
                                          h(
                                            "div",
                                            null,
                                            item.title || item.asin,
                                          ),
                                          h(
                                            "div",
                                            null,
                                            h(
                                              "span",
                                              {
                                                className:
                                                  "pill " +
                                                  (item.kind === "organic"
                                                    ? "good"
                                                    : "warn"),
                                              },
                                              item.kind,
                                            ),
                                          ),
                                          h(
                                            "div",
                                            null,
                                            item.isMyListing
                                              ? h(
                                                  "span",
                                                  { className: "pill good" },
                                                  "yes",
                                                )
                                              : h(
                                                  "span",
                                                  { className: "pill" },
                                                  "no",
                                                ),
                                          ),
                                          h(
                                            "div",
                                            null,
                                            fmtCurrency(
                                              item.price_value,
                                              item.price_currency,
                                            ),
                                          ),
                                          h(
                                            "div",
                                            null,
                                            h(
                                              "button",
                                              {
                                                className: "mini-action",
                                                disabled: !item.isMyListing,
                                                title: item.isMyListing
                                                  ? "Open this ASIN in ASIN mode"
                                                  : "Only available for owned ASINs",
                                                onClick: (e) => {
                                                  e.stopPropagation();
                                                  if (!item.isMyListing) return;
                                                  setMode("asin");
                                                  setSelectedAsin(item.asin);
                                                },
                                              },
                                              "open",
                                            ),
                                          ),
                                        ],
                                      ),
                                    ),
                                  ),
                                ),
                            );
                          })(),
                        ),
                    ),
              ),
            ),

            mode === "asin" &&
              h(
                "section",
                { className: "panel" },
                h(
                  "div",
                  { className: "panel-head" },
                  h(
                    "div",
                    null,
                    h("div", { className: "panel-title" }, "ASIN detail"),
                    h(
                      "div",
                      { className: "panel-sub" },
                      "Where this ASIN shows up and how it ranks",
                    ),
                  ),
                  h(
                    "div",
                    { className: "panel-sub mono" },
                    selectedAsinData?.asin || "",
                  ),
                ),
                h(
                  "div",
                  { className: "panel-body detail" },
                  renderAsinDetail(selectedAsinData),
                ),
              ),
          ),
        );
      }

      function renderAsinDetail(asin) {
        if (!asin)
          return h("div", { className: "insight" }, "No ASIN selected.");
        const uniqueTerms = new Set(asin.appearances.map((a) => a.searchTerm))
          .size;
        const best = asin.appearances
          .slice()
          .sort((a, b) => a.rank - b.rank)[0];
        return [
          h(
            "div",
            { className: "detail-hero", key: "hero" },
            h("img", {
              className: "thumb",
              src:
                asin.asin_image_url ||
                "https://via.placeholder.com/124?text=ASIN",
              alt: asin.title || asin.asin,
            }),
            h(
              "div",
              null,
              h(
                "div",
                { className: "title", style: { fontSize: "22px" } },
                asin.title || asin.asin,
              ),
              h("div", { className: "meta", style: { marginTop: "10px" } }, [
                h(
                  "span",
                  { className: "pill good", key: "og" },
                  asin.bestOrganicRank != null
                    ? "organic #" + asin.bestOrganicRank
                    : "no organic rank",
                ),
                h(
                  "span",
                  { className: "pill warn", key: "ppc" },
                  asin.bestPpcRank != null
                    ? "ppc #" + asin.bestPpcRank
                    : "no ppc rank",
                ),
                h(
                  "span",
                  { className: "pill", key: "apps" },
                  asin.appearances.length + " tracked appearances",
                ),
                h("span", { className: "mono", key: "id" }, asin.asin),
              ]),
              h("div", { className: "detail-grid" }, [
                statBlock(
                  "Best visible spot",
                  best ? best.searchTerm + " • #" + best.rank : "n/a",
                  "Top placement among tracked terms",
                ),
                statBlock(
                  "Search terms hit",
                  uniqueTerms,
                  "Unique terms where this ASIN appears",
                ),
                statBlock(
                  "Organic wins",
                  asin.appearances.filter((a) => a.mode === "organic").length,
                  "Times it showed up organically",
                ),
                statBlock(
                  "Sponsored wins",
                  asin.appearances.filter((a) => a.mode === "ppc").length,
                  "Times it showed up in ads",
                ),
              ]),
            ),
          ),
          h("div", { className: "insight-list", key: "insights" }, [
            h(
              "div",
              { className: "insight", key: "i1" },
              best
                ? "Best placement is " +
                    best.mode +
                    " rank #" +
                    best.rank +
                    " on " +
                    best.searchTerm +
                    "."
                : "No ranked appearances found in the tracked data.",
            ),
            h(
              "div",
              { className: "insight", key: "i2" },
              asin.bestOrganicRank != null
                ? "Organic placement captured for this ASIN."
                : "No organic placement captured for this ASIN.",
            ),
          ]),
          h(
            "div",
            { className: "table-wrap", key: "table" },
            h(
              "table",
              null,
              h(
                "thead",
                null,
                h(
                  "tr",
                  null,
                  h("th", null, "Search term"),
                  h("th", null, "Mode"),
                  h("th", null, "Rank"),
                  h("th", null, "Price"),
                  h("th", null, "Link"),
                ),
              ),
              h(
                "tbody",
                null,
                asin.appearances.map((a, idx) =>
                  h(
                    "tr",
                    { key: idx },
                    h("td", null, a.searchTerm),
                    h(
                      "td",
                      null,
                      h(
                        "span",
                        {
                          className:
                            "pill " + (a.mode === "organic" ? "good" : "warn"),
                        },
                        a.mode,
                      ),
                    ),
                    h("td", null, "#" + a.rank),
                    h("td", null, fmtCurrency(a.price_value, a.price_currency)),
                    h(
                      "td",
                      null,
                      h(
                        "a",
                        {
                          href: a.asin_url,
                          target: "_blank",
                          rel: "noreferrer",
                          style: { color: "var(--accent)" },
                        },
                        "open",
                      ),
                    ),
                  ),
                ),
              ),
            ),
          ),
        ];
      }

      function renderSearchDetail(search, core) {
        if (!search)
          return h("div", { className: "insight" }, "No search term selected.");
        const items = [
          ...search.ppcRanks.map((x) => ({ ...x, kind: "ppc" })),
          ...search.organicRanks.map((x) => ({ ...x, kind: "organic" })),
        ].sort((a, b) => {
          const ra = a.kind === "ppc" ? a.ppcRank : a.organicRank;
          const rb = b.kind === "ppc" ? b.ppcRank : b.organicRank;
          return ra - rb;
        });
        const ownedCount = items.filter((i) => i.isMyListing).length;
        const ppcCount = items.filter((i) => i.kind === "ppc").length;
        const organicCount = items.filter((i) => i.kind === "organic").length;
        return [
          h(
            "div",
            { className: "detail-hero", key: "hero" },
            h(
              "div",
              null,
              h(
                "div",
                { className: "eyebrow", style: { margin: "0 0 10px" } },
                "Demand snapshot",
              ),
              h(
                "div",
                { className: "title", style: { fontSize: "24px" } },
                search.searchTerm,
              ),
              h("div", { className: "meta", style: { marginTop: "10px" } }, [
                h(
                  "span",
                  { className: "pill good", key: "hits" },
                  ownedCount + " owned hits",
                ),
                h(
                  "span",
                  { className: "pill warn", key: "ppc" },
                  ppcCount + " sponsored cards",
                ),
                h(
                  "span",
                  { className: "pill", key: "org" },
                  organicCount + " organic cards",
                ),
              ]),
            ),
            h("div", { className: "detail-grid" }, [
              statBlock(
                "Purchases",
                core?.purchaseCount ?? "n/a",
                "Snapshot date: " + (core?.date || "n/a"),
              ),
              statBlock(
                "Impressions",
                core?.impressions ?? "n/a",
                "Across the last full snapshot",
              ),
              statBlock(
                "Clicks",
                core?.clicks ?? "n/a",
                "Search page engagement",
              ),
              statBlock(
                "SQP relative rank",
                core?.sqpRelativeRank ?? core?.organicRank ?? "n/a",
                "SQP bucket (relative to this ASIN's terms) - NOT a live SERP position",
              ),
            ]),
          ),
          h("div", { className: "insight-list", key: "insights" }, [
            h(
              "div",
              { className: "insight", key: "i1" },
              core
                ? "This term generated " +
                    core.purchaseCount +
                    " purchases and " +
                    core.searchVolume +
                    " search volume, so it is one of the highest-value queries in the run."
                : "No core metrics loaded for this term.",
            ),
            h(
              "div",
              { className: "insight", key: "i2" },
              ownedCount > 0
                ? "Your products appear " +
                    ownedCount +
                    " times on the first page for this query."
                : "No owned ASINs found on this search page.",
            ),
            h(
              "div",
              { className: "insight", key: "i3" },
              "Sponsored placements occupy " +
                ppcCount +
                " slots before the organic list finishes.",
            ),
          ]),
          h(
            "div",
            { className: "table-wrap", key: "table" },
            h(
              "table",
              null,
              h(
                "thead",
                null,
                h(
                  "tr",
                  null,
                  h("th", null, "Rank"),
                  h("th", null, "ASIN"),
                  h("th", null, "Title"),
                  h("th", null, "Price"),
                  h("th", null, "Type"),
                  h("th", null, "Owned"),
                ),
              ),
              h(
                "tbody",
                null,
                items.map((item, idx) =>
                  h(
                    "tr",
                    { key: idx },
                    h(
                      "td",
                      null,
                      "#" +
                        (item.kind === "ppc" ? item.ppcRank : item.organicRank),
                    ),
                    h("td", { className: "mono" }, item.asin),
                    h("td", null, item.title || item.asin),
                    h(
                      "td",
                      null,
                      fmtCurrency(item.price_value, item.price_currency),
                    ),
                    h(
                      "td",
                      null,
                      h(
                        "span",
                        {
                          className:
                            "pill " +
                            (item.kind === "organic" ? "good" : "warn"),
                        },
                        item.kind,
                      ),
                    ),
                    h(
                      "td",
                      null,
                      item.isMyListing
                        ? h("span", { className: "pill good" }, "yes")
                        : h("span", { className: "pill" }, "no"),
                    ),
                  ),
                ),
              ),
            ),
          ),
        ];
      }

      function statBlock(label, value, sub) {
        return h(
          "div",
          { className: "metric" },
          h("div", { className: "k" }, label),
          h(
            "div",
            { className: "v", style: { fontSize: "18px", lineHeight: 1.25 } },
            value,
          ),
          h("div", { className: "s" }, sub),
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
